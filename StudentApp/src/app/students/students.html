
  <div class="card bg-warning h-100">
    <div class="card-header d-flex justify-content-between align-items-center py-2 px-3">
      <span><i class="bi bi-table me-2"></i>Students</span>
      <span class="record-count" id="recordCount">1 record</span>
    </div>
    <div class="card-body p-3">
      <!-- Search bar -->
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text bg-dark border-dark text-warning"
          ><i class="bi bi-search"></i
        ></span>
        <input
          type="text"
          class="form-control"
          id="searchInput"
          placeholder="Search by name, email, or city…"
          oninput="filterTable()"
        />
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table
          class="table table-bordered table-hover table-sm mb-0 bg-white rounded"
          id="studentTable"
        >
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Mobile</th>
              <th>Email</th>
              <th>City</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            @for (student of studentList; track student.studentId; let idx = $index) {
              <!-- Use app-student as an attribute on the <tr> tag -->
              <tr app-student [student]="student" [index]="idx + 1"></tr>
            }
          </tbody>
        </table>
      </div>
      @if (studentList.length === 0) {
        <div id="emptyState" class="empty-state">
          <i class="bi bi-inbox fs-2 d-block mb-2"></i>No students found.
        </div>
      }
    </div>
  </div>
