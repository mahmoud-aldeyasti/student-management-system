<!-- ===== FORM COLUMN (col-4) ===== -->

<form class="card bg-warning form-card h-100" (ngSubmit)="saveStudent()">
  <div class="card-header d-flex justify-content-between align-items-center py-2 px-3">
    <span id="formTitle"><i class="bi bi-person-plus me-2"></i>Add Student</span>
    <button class="btn btn-sm btn-outline-dark py-0" (click)="resetForm()" title="Clear form">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div class="card-body p-3">
    <!-- Hidden ID -->
    <input
      type="hidden"
      id="studentId"
      [ngModelOptions]="{ standalone: true }"
      [(ngModel)]="studentobj.studentId"
    />

    <!-- Personal Info -->
    <div class="section-divider">Personal Info</div>

    <div class="mb-2">
      <label class="form-label">Full Name *</label>
      <input
        [(ngModel)]="studentobj.studName"
        [ngModelOptions]="{ standalone: true }"
        type="text"
        class="form-control form-control-sm"
        id="studName"
        placeholder="e.g. Mahmoud Mohamed"
      />
    </div>
    <div class="mb-2">
      <label class="form-label">Mobile No *</label>
      <input
        [(ngModel)]="studentobj.mobileNo"
        [ngModelOptions]="{ standalone: true }"
        type="text"
        class="form-control form-control-sm"
        id="mobileNo"
        placeholder="e.g. 01081648930"
      />
    </div>
    <div class="mb-2">
      <label class="form-label">Email *</label>
      <input
        type="email"
        [(ngModel)]="studentobj.email"
        [ngModelOptions]="{ standalone: true }"
        class="form-control form-control-sm"
        id="email"
        placeholder="e.g. student@email.com"
      />
    </div>

    <!-- Address -->
    <div class="section-divider">Address</div>

    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label">City</label>
        <input
          [(ngModel)]="studentobj.city"
          [ngModelOptions]="{ standalone: true }"
          type="text"
          class="form-control form-control-sm"
          id="city"
          placeholder="City"
        />
      </div>
      <div class="col-6">
        <label class="form-label">State</label>
        <input
          [(ngModel)]="studentobj.state"
          [ngModelOptions]="{ standalone: true }"
          type="text"
          class="form-control form-control-sm"
          id="state"
          placeholder="State"
        />
      </div>
    </div>
    <div class="mb-2">
      <label class="form-label">Pincode</label>
      <input
        [(ngModel)]="studentobj.pincode"
        [ngModelOptions]="{ standalone: true }"
        type="text"
        class="form-control form-control-sm"
        id="pincode"
        placeholder="Pincode"
      />
    </div>
    <div class="mb-2">
      <label class="form-label">Address Line 1</label>
      <input
        [(ngModel)]="studentobj.adressline1"
        [ngModelOptions]="{ standalone: true }"
        type="text"
        class="form-control form-control-sm"
        id="adressline1"
        placeholder="Street / Building"
      />
    </div>
    <div class="mb-3">
      <label class="form-label">Address Line 2</label>
      <input
        [(ngModel)]="studentobj.addressline2"
        [ngModelOptions]="{ standalone: true }"
        type="text"
        class="form-control form-control-sm"
        id="addressline2"
        placeholder="Area / Landmark"
      />
    </div>

    <!-- Buttons -->
    <div class="d-grid gap-2">
      <button class="btn btn-dark btn-sm" type="submit">
        <i class="bi bi-floppy me-1"></i
        ><span id="saveBtnLabel">{{
          studentobj.studentId ? 'Update Student' : 'Save Student'
        }}</span>
      </button>
      <button class="btn btn-outline-dark btn-sm" (click)="resetForm()">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Clear
      </button>
    </div>
  </div>
</form>

<!-- /row -->
